baseURL = "https://path2pwn.carlojaeavila.dev/"
languageCode = "en-us"
title = "/path/to/pwn"
theme = "carlo"

[pagination]
  pagerSize = 10

# Emit /index.json (Fuse.js search index) alongside the home page. The search
# page (layouts/_default/search.html) fetches it client-side — no build step,
# no server, no third-party calls. See CLAUDE.md → Notes Site → Search.
[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = false
    codeFences = true
    noClasses = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  [markup.goldmark.renderer]
    unsafe = true

[params]
  author = "carlo"
  description = "notes on security, tooling, and whatever else"
