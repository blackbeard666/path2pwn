{{ define "main" }}
<div class="page-header">
  <p class="section-label">// search</p>
</div>

<div class="search-page-box">
  <input
    type="search"
    id="search-page-input"
    class="search-page-input"
    placeholder="search cves, writeups, tags…"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
  />
</div>

<p class="search-page-status" id="search-page-status"></p>
<ul class="post-list" id="search-page-results"></ul>
<noscript><p class="search-page-status">Search requires JavaScript.</p></noscript>
{{ end }}
