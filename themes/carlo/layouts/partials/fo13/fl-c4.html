<figure class="hc-fig" id="fig-fl-c4">
<p class="hc-fig-title">ToxicMiner: brute-force the volume serial</p>
<svg class="hc-svg" viewBox="0 0 960 438" role="img" aria-labelledby="fl-c4-t fl-c4-d" preserveAspectRatio="xMidYMid meet">
<title id="fl-c4-t">ToxicMiner: brute-force the volume serial</title><desc id="fl-c4-d">A trojanized cpuminer derives an RC4 key from the C: volume serial with a modified SHA-256d. Re-implementing the hash failed; mapping the PE and calling its own functions made a 2^32 sweep exact.</desc>
<defs><marker id="ar-fl-c4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hc-arrowhead" d="M0,0L8,4L0,8z"/></marker></defs><path class="hc-edge" fill="none" d="M319,43 H361" marker-end="url(#ar-fl-c4)"/><path class="hc-edge" fill="none" d="M597,43 H639" marker-end="url(#ar-fl-c4)"/><path class="hc-edge" fill="none" d="M757,74 V106" marker-end="url(#ar-fl-c4)"/><path class="hc-edge" fill="none" d="M641,139 H599" marker-end="url(#ar-fl-c4)"/><path class="hc-edge" fill="none" d="M480,170 V202" marker-end="url(#ar-fl-c4)"/><path class="hc-edge" fill="none" d="M480,266 V298" marker-end="url(#ar-fl-c4)"/><path class="hc-edge" fill="none" d="M597,331 H639" marker-end="url(#ar-fl-c4)"/><g class="hc-node hc-node-plat"><title>ToxicMiner.exe: trojanized cpuminer-multi</title><rect x="86" y="12" width="233" height="62"/><text class="hc-node-t" x="100" y="35">ToxicMiner.exe</text><text class="hc-node-s" x="100" y="53">trojanized cpuminer-multi</text></g><g class="hc-node"><title>hidden routine: reads the C: volume serial</title><rect x="363" y="12" width="233" height="62"/><text class="hc-node-t" x="377" y="35">hidden routine</text><text class="hc-node-s" x="377" y="53">reads the C: volume serial</text></g><g class="hc-node"><title>SHA-256d on u32 words: seed word 0x0b501e7e</title><rect x="641" y="12" width="233" height="62"/><text class="hc-node-t" x="655" y="35">SHA-256d on u32 words</text><text class="hc-node-s" x="655" y="53">seed word 0x0b501e7e</text></g><g class="hc-node"><title>RC4, 16-byte key: decrypts a 0x33-byte blob</title><rect x="641" y="108" width="233" height="62"/><text class="hc-node-t" x="655" y="131">RC4, 16-byte key</text><text class="hc-node-s" x="655" y="149">decrypts a 0x33-byte blob</text></g><g class="hc-node"><title>pure-C rewrite: recover.c: no hit, the SHA is modified</title><rect x="363" y="108" width="233" height="62"/><text class="hc-node-t" x="377" y="131">pure-C rewrite</text><text class="hc-node-s" x="377" y="149">recover.c: no hit,</text><text class="hc-node-s" x="377" y="163">the SHA is modified</text></g><g class="hc-node hc-node-ours"><title>image-mapping harness: map PE at 0x140000000, call its own functions</title><rect x="363" y="204" width="233" height="62"/><text class="hc-node-t" x="377" y="227">image-mapping harness</text><text class="hc-node-s" x="377" y="245">map PE at 0x140000000,</text><text class="hc-node-s" x="377" y="259">call its own functions</text></g><g class="hc-node"><title>2^32 serial sweep: sharded, find flare-on.com</title><rect x="363" y="300" width="233" height="62"/><text class="hc-node-t" x="377" y="323">2^32 serial sweep</text><text class="hc-node-s" x="377" y="341">sharded, find flare-on.com</text></g><g class="hc-node hc-node-plat"><title>flag: serial 0x01CEC01D</title><rect x="641" y="300" width="233" height="62" rx="31"/><text class="hc-node-t" x="667" y="323">flag</text><text class="hc-node-s" x="667" y="341">serial 0x01CEC01D</text></g>
</svg>
<figcaption>78.6 minutes, Opus 5.5 then Opus 4.8. Calling the sample's own code removed the risk of a subtly wrong hash.</figcaption>
