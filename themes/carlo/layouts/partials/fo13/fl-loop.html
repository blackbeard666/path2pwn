aude Code session</text><text class="hc-node-s" x="377" y="53">Windows 11, one long session</text><text class="hc-node-s" x="377" y="67">Opus 5.5, later Opus 4.8</text></g><g class="hc-node"><title>Triage, reverse, script: Ghidra headless, unicorn, Frida, one script per idea</title><rect x="641" y="12" width="233" height="62"/><text class="hc-node-t" x="655" y="35">Triage, reverse, script</text><text class="hc-node-s" x="655" y="53">Ghidra headless, unicorn,</text><text class="hc-node-s" x="655" y="67">Frida, one script per idea</text></g><g class="hc-node"><title>Stuck?: no new verified fact</title><polygon points="655,108 860,108 874,139 860,170 655,170 641,139"/><text class="hc-node-t" x="665" y="131">Stuck?</text><text class="hc-node-s" x="665" y="149">no new verified fact</text></g><g class="hc-node hc-node-ours"><title>I steer: &#x27;continue&#x27;, an offline hint, /model, &#x27;spin up subagents&#x27;</title><rect x="363" y="108" width="233" height="62"/><text class="hc-node-t" x="377" y="131">I steer</text><text class="hc-node-s" x="377" y="149">&#x27;continue&#x27;, an offline hint,</text><text class="hc-node-s" x="377" y="163">/model, &#x27;spin up subagents&#x27;</text></g><g class="hc-node"><title>Flag candidate: printed by a solver script</title><rect x="641" y="204" width="233" height="62"/><text class="hc-node-t" x="655" y="227">Flag candidate</text><text class="hc-node-s" x="655" y="245">printed by a solver script</text></g><g class="hc-node hc-node-ours"><title>I submit it: on the FLARE-On scoreboard</title><rect x="363" y="204" width="233" height="62"/><text class="hc-node-t" x="377" y="227">I submit it</text><text class="hc-node-s" x="377" y="245">on the FLARE-On scoreboard</text></g><g class="hc-node"><title>Accepted?: </title><polygon points="377,300 583,300 597,331 583,362 377,362 363,331"/><text class="hc-node-t" x="387" y="336">Accepted?</text></g><g class="hc-node hc-node-plat"><title>Write-up and commit: markdown, a diagram, stats</title>< <figcaption>One person, one Claude Code window, and a folder of tools. Red boxes are what I did; the rest is the model. A fresh session was the escape hatch, used twice.</figcaption>
<details class="hc-tv"><summary>steps and files</summary><div class="hc-tablewrap"><table class="hc-table "><thead><tr><th>step</th><th>what happens</th><th>files</th></tr></thead><tbody><tr><td>Kickoff prompt</td><td>I paste the challenge text, the archive path and where the tools live (Ghidra, Frida, Python, Node, WSL).</td><td>-</td></tr><tr><td>Claude Code session</td><td>One interactive session; challenges 1-7 and crux attempt 1 all ran in the same session, across compactions.</td><td>-</td></tr><tr><td>Triage, reverse, script</td><td>The model extracts, decompiles, emulates and writes a solver script for every hypothesis.</td><td>-</td></tr><tr><td>I steer</td><td>Nudges, corrections (no live server, the brute force is unnecessary), model switches.</td><td>-</td></tr><tr><td>Stuck?</td><td>The only stop signal was me reading the session; nothing in the setup measured progress.</td><td>-</td></tr><tr><td>I submit it</td><td>on the FLARE-On scoreboard</td><td>-</td></tr><tr><td>Flag candidate</td><td>Every flag came out of a script that can be re-run; the repo keeps them.</td><td>-</td></tr><tr><td>Fresh session</td><td>Used twice (crux, NeonOutRun); both solved within an hour.</td><td>-</td></tr><tr><td>Accepted?</td><td></td><td>-</td></tr><tr><td>Write-up and commit</td><td>Each solve ends with a write-up, the solver files and a commit.</td><td>-</td></tr></tbody></table></div></details>
</figure>
