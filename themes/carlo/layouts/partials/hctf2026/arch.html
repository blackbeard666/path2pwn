<svg class="hc-svg" viewBox="0 0 860 310" role="img" aria-labelledby="arch-t arch-d" preserveAspectRatio="xMidYMid meet">
<title id="arch-t">How one challenge flows through the harness</title><desc id="arch-d">Row one: drop watcher, triage, reuse race and worker reach GM CORRECT with a verified solver. Row two: the timed runner replays that solver, via Homebase. Row three: a failed variant goes to generalize and duel, becomes a regression case, and feeds the overnight ratchet.</desc>

 x="452" y="156">GM CORRECT + verified solve.py</text><text class="hc-node-s" x="452" y="175">the chain moves on</text></g><g class="hc-node "><rect x="225" y="132" width="195" height="58"/><text class="hc-node-t" x="237" y="156">timed runner</text><text class="hc-node-s" x="237" y="175">solve.py, no LLM</text></g><g class="hc-node hc-node-plat"><rect x="10" y="132" width="195" height="58"/><text class="hc-node-t" x="22" y="156">Homebase VM</text><text class="hc-node-s" x="22" y="175">in-network relay</text></g><g class="hc-node hc-node-ours"><rect x="225" y="240" width="195" height="58"/><text class="hc-node-t" x="237" y="264">generalize + duel</text><text class="hc-node-s" x="237" y="283">+ live answer</text></g><g class="hc-node "><rect x="440" y="240" width="195" height="58"/><text class="hc-node-t" x="452" y="264">regression cases</text><text class="hc-node-s" x="452" y="283">every failed variant</text></g><g class="hc-node "><rect x="655" y="240" width="195" height="58"/><text class="hc-node-t" x="667" y="264">ratchet + prebuild</text><text class="hc-node-s" x="667" y="283">overnight, test-gated</text></g>
</svg>
<figcaption>One chain per challenge, all chains in parallel. Red: where answers come from. Green: the platform. Overnight, the cases and the ratchet feed the next day's race.</figcaption>
