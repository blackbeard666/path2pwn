<figure class="hc-fig" id="fig-chain">
<p class="hc-fig-title">The chain state machine</p>
<svg class="hc-svg" viewBox="0 0 860 240" role="img" aria-labelledby="chain-t chain-d" preserveAspectRatio="xMidYMid meet">
<title id="chain-t">The chain state machine</title><desc id="chain-d">Top row: queued, single, time_trial, mastery, done. Below: crash-retry under queued, help or blocked under single, and a shared generalizing state that both timed modes drop into when a variant fails and return from once the edit is accepted or restored.</desc>
<defs><marker id="hc-arrow-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hc-arrowhead" d="M0,0L8,4L0,8z"/></marker></defs><line class="hc-edge" x1="166" y1="59.0" x2="178" y2="59.0" marker-end="url(#hc-arrow-c)"/><line class="hc-edge" x1="336" y1="59.0" x2="348" y2="59.0" marker-end="url(#hc-arrow-c)"/><line class="hc-edge" x1="506" y1="59.0" x2="518" y2="59.0" marker-end="url(#hc-arrow-c)"/><line class="hc-edge" x1="676" y1="59.0" x2="688" y2="59.0" marker-end="url(#hc-arrow-c)"/><line class="hc-edge" x1="70.0" y1="88" x2="70.0" y2="166" marker-end="url(#hc-arrow-c)"/><line class="hc-edge" x1="106.0" y1="168" x2="106.0" y2="90" marker-end="url(#hc-arrow-c)"/><text class="hc-rowlab" x="62.0" y="132.0" text-anchor="end">crash</text><text class="hc-rowlab" x="114.0" y="132.0" text-anchor="start">retry once</text><line class="hc-edge" x1="410.0" y1="88" x2="410.0" y2="166" marker-end="url(#hc-arrow-c)"/><line class="hc-edge" x1="446.0" y1="168" x2="446.0" y2="90" marker-end="url(#hc-arrow-c)"/><text class="hc-rowlab" x="402.0" y="132.0" text-anchor="end">variant fails</text><line class="hc-edge" x1="580.0" y1="88" x2="580.0" y2="166" marker-end="url(#hc-arrow-c)"/><line class="hc-edge" x1="616.0" y1="168" x2="616.0" y2="90" marker-end="url(#hc-arrow-c)"/><text class="hc-rowlab" x="624.0" y="132.0" text-anchor="start">accepted / restored</text><line class="hc-edge" x1="258.0" y1="88" x2="258.0" y2="166" marker-end="url(#hc-arrow-c)"/><text class="hc-rowlab" x="266.0" y="132.0" text-anchor="start">stuck</text><g class="hc-node "><rect x="10" y="30" width="156" height="58"/><text class="hc-node-t" x="22" y="54">queued</text><text class="hc-node-s" x="22" y="73">created when it lists</text></g><g class="hc-node hc-node-ours"><rect x="180" y="30" width="156" height="58"/><text class="hc-node-t" x="192" y="54">single</text><text class="hc-node-s" x="192" y="73">fetch · race · solve</text></g><g class="hc-node "><rect x="350" y="30" width="156" height="58"/><text class="hc-node-t" x="362" y="54">time_trial</text><text class="hc-node-s" x="362" y="73">running · retrying</text></g><g class="hc-node "><rect x="520" y="30" width="156" height="58"/><text class="hc-node-t" x="532" y="54">mastery</text><text class="hc-node-s" x="532" y="73">re-pass TT if needed</text></g><g class="hc-node hc-node-plat"><rect x="690" y="30" width="156" height="58"/><text class="hc-node-t" x="702" y="54">done</text><text class="hc-node-s" x="702" y="73">GM CORRECT on all 3</text></g><g class="hc-node "><rect x="10" y="168" width="156" height="58"/><text class="hc-node-t" x="22" y="192">crash-retry</text><text class="hc-node-s" x="22" y="211">solved modes kept</text></g><g class="hc-node "><rect x="180" y="168" width="156" height="58"/><text class="hc-node-t" x="192" y="192">help / blocked</text><text class="hc-node-s" x="192" y="211">HELP.md for a human</text></g><g class="hc-node hc-node-ours"><rect x="350" y="168" width="326" height="58"/><text class="hc-node-t" x="362" y="192">generalizing</text><text class="hc-node-s" x="362" y="211">transactional edit · duel · live answer</text></g>
</svg>
<figcaption>Every chain writes its stage to <code>chain.json</code> atomically; the feed, dashboard and <code>hctf why</code> all read it.</figcaption>
<details class="hc-tv"><summary>all stages</summary><div class="hc-tablewrap"><table class="hc-table "><thead><tr><th>stage</th><th>meaning</th></tr></thead><tbody><tr><td><code>queued</code></td><td>chain created the moment its lane lists</td></tr><tr><td><code>single:fetch</code> / <code>reuse-won</code> / <code>solving</code></td><td>download ∥ warm worker; the reuse race can finish it alone</td></tr><tr><td><code>single:help</code> / <code>blocked</code></td><td>worker wrote HELP.md, or launches ran out</td></tr><tr><td><code>&lt;mode&gt;:running</code> / <code>retrying</code> / <code>continuing</code></td><td>timed runner: start → download → solve.py → submit</td></tr><tr><td><code>&lt;mode&gt;:generalizing</code> / <code>fixing</code></td><td>variant captured as a case; worker edits the solver; kept only if nothing regresses</td></tr><tr><td><code>&lt;mode&gt;:untimed</code> / <code>rate-limited</code> / <code>start-refused</code></td><td>pool exhausted or GM pushback: fall back, wait, resume the same attempt</td></tr><tr><td><code>done</code></td><td>all three modes GM-CORRECT</td></tr><tr><td><code>crash-retry</code> / <code>crashed</code></td><td>exception: one retry that skips solved modes</td></tr></tbody></table></div></details>
</figure>
