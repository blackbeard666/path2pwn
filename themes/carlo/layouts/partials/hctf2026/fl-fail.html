<figure class="hc-fig" id="fig-fl-fail">
<p class="hc-fig-title">When a timed variant fails</p>
<svg class="hc-svg" viewBox="0 0 960 918" role="img" aria-labelledby="fl-fail-t fl-fail-d" preserveAspectRatio="xMidYMid meet">
<title id="fl-fail-t">When a timed variant fails</title><desc id="fl-fail-d">The variant becomes a regression case, then repairs race: a library racer, a live answer and a transactional generalize; up to five retries, then an untimed fallback, then a human.</desc>
<defs><marker id="ar-fl-fail" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hc-arrowhead" d="M0,0L8,4L0,8z"/></marker></defs><path class="hc-edge" fill="none" d="M203,74 V106" marker-end="url(#ar-fl-fail)"/><path class="hc-edge" fill="none" d="M203,170 V202" marker-end="url(#ar-fl-fail)"/><path class="hc-edge" fill="none" d="M203,170 V187 H480 V202" marker-end="url(#ar-fl-fail)"/><text class="hc-rowlab" x="210" y="186" text-anchor="start">∥</text><path class="hc-edge" fill="none" d="M203,170 V187 H757 V202" marker-end="url(#ar-fl-fail)"/><path class="hc-edge" fill="none" d="M203,266 V298" marker-end="url(#ar-fl-fail)"/><path class="hc-edge" fill="none" d="M480,266 V298" marker-end="url(#ar-fl-fail)"/><path class="hc-edge" fill="none" d="M757,266 V283 H480 V298" marker-end="url(#ar-fl-fail)"/><path class="hc-edge" fill="none" d="M203,362 V394" marker-end="url(#ar-fl-fail)"/><path class="hc-edge" fill="none" d="M203,458 V490" marker-end="url(#ar-fl-fail)"/><path class="hc-edge" fill="none" d="M319,523 H480 V586" marker-end="url(#ar-fl-fail)"/><text class="hc-rowlab" x="325" y="516" text-anchor="start">yes</text><path class="hc-edge" fill="none" d="M203,554 V586" marker-end="url(#ar-fl-fail)"/><text class="hc-rowlab" x="210" y="570" text-anchor="start">no</text><path class="hc-edge" fill="none" d="M203,650 V682" marker-end="url(#ar-fl-fail)"/><path class="hc-edge" fill="none" d="M480,650 V667 H203 V682" marker-end="url(#ar-fl-fail)"/><path class="hc-edge" fill="none" d="M203,746 V778" marker-end="url(#ar-fl-fail)"/><text class="hc-rowlab" x="210" y="762" text-anchor="start">yes</text><path class="hc-edge" fill="none" d="M319,715 H361" marker-end="url(#ar-fl-fail)"/><text class="hc-rowlab" x="341" y="708" text-anchor="middle">no</text><path class="hc-edge" fill="none" d="M480,746 V778" marker-end="url(#ar-fl-fail)"/><text class="hc-rowlab" x="487" y="762" text-anchor="start">still failing</text><g class="hc-node"><title>capture the variant: a regression case with the GM&#x27;s per-field verdicts</title><rect x="86" y="12" width="233" height="62"/><text class="hc-node-t" x="100" y="35">capture the variant</text><text class="hc-node-s" x="100" y="53">a regression case with the GM&#x27;s</text><text class="hc-node-s" x="100" y="67">per-field verdicts</text></g><g class="hc-node"><title>probe the fields: which are wrong, which missing</title><rect x="86" y="108" width="233" height="62"/><text class="hc-node-t" x="100" y="131">probe the fields</text><text class="hc-node-s" x="100" y="149">which are wrong, which missing</text></g><g class="hc-node"><title>snapshot (the &#x27;before&#x27;): solver, the cases that pass, every expected.json</title><rect x="86" y="204" width="233" height="62"/><text class="hc-node-t" x="100" y="227">snapshot (the &#x27;before&#x27;)</text><text class="hc-node-s" x="100" y="245">solver, the cases that pass,</text><text class="hc-node-s" x="100" y="259">every expected.json</text></g><g class="hc-node hc-node-ours"><title>live answer: a worker answers the open attempt by hand (≤80 fields)</title><rect x="363" y="204" width="233" height="62"/><text class="hc-node-t" x="377" y="227">live answer</text><text class="hc-node-s" x="377" y="245">a worker answers the open attempt</text><text class="hc-node-s" x="377" y="259">by hand (≤80 fields)</text></g><g class="hc-node"><title>library racer: warmups: lane decoder, no model, ≤60 probes</title><rect x="641" y="204" width="233" height="62"/><text class="hc-node-t" x="655" y="227">library racer</text><text class="hc-node-s" x="655" y="245">warmups: lane decoder, no</text><text class="hc-node-s" x="655" y="259">model, ≤60 probes</text></g><g class="hc-node hc-node-ours"><title>generalize (+ duel): fix the construct family, not this sample</title><rect x="86" y="300" width="233" height="62"/><text class="hc-node-t" x="100" y="323">generalize (+ duel)</text><text class="hc-node-s" x="100" y="341">fix the construct family, not</text><text class="hc-node-s" x="100" y="355">this sample</text></g><g class="hc-node hc-node-plat"><title>first repair to pass wins: the others are stopped</title><rect x="363" y="300" width="233" height="62" rx="31"/><text class="hc-node-t" x="389" y="323">first repair to pass wins</text><text class="hc-node-s" x="389" y="341">the others are stopped</text></g><g class="hc-node"><title>restore every expected.json: workers never author expected answers</title><rect x="86" y="396" width="233" height="62"/><text class="hc-node-t" x="100" y="419">restore every expected.json</text><text class="hc-node-s" x="100" y="437">workers never author</text><text class="hc-node-s" x="100" y="451">expected answers</text></g><g class="hc-node"><title>anything broken?: run every case that passed before</title><polygon points="100,492 305,492 319,523 305,554 100,554 86,523"/><text class="hc-node-t" x="110" y="515">anything broken?</text><text class="hc-node-s" x="110" y="533">run every case that passed</text><text class="hc-node-s" x="110" y="547">before</text></g><g class="hc-node"><title>restore the snapshot: the edit goes to .generalize-rejected/</title><rect x="363" y="588" width="233" height="62"/><text class="hc-node-t" x="377" y="611">restore the snapshot</text><text class="hc-node-s" x="377" y="629">the edit goes to</text><text class="hc-node-s" x="377" y="643">.generalize-rejected/</text></g><g class="hc-node hc-node-ours"><title>keep the edit: </title><rect x="86" y="588" width="233" height="62"/><text class="hc-node-t" x="100" y="624">keep the edit</text></g><g class="hc-node"><title>retries left (≤5)?: rate limits and refused starts don&#x27;t count</title><polygon points="100,684 305,684 319,715 305,746 100,746 86,715"/><text class="hc-node-t" x="110" y="707">retries left (≤5)?</text><text class="hc-node-s" x="110" y="725">rate limits and refused starts</text><text class="hc-node-s" x="110" y="739">don&#x27;t count</text></g><g class="hc-node"><title>next timed attempt: usually passes: the solver now knows this variant</title><rect x="86" y="780" width="233" height="62" rx="31"/><text class="hc-node-t" x="112" y="803">next timed attempt</text><text class="hc-node-s" x="112" y="821">usually passes: the solver</text><text class="hc-node-s" x="112" y="835">now knows this variant</text></g><g class="hc-node"><title>untimed fallback: 3 rounds on a fresh untimed attempt</title><rect x="363" y="684" width="233" height="62"/><text class="hc-node-t" x="377" y="707">untimed fallback</text><text class="hc-node-s" x="377" y="725">3 rounds on a fresh untimed</text><text class="hc-node-s" x="377" y="739">attempt</text></g><g class="hc-node hc-node-ours"><title>blocked → a human: !!! in the feed</title><rect x="363" y="780" width="233" height="62" rx="31"/><text class="hc-node-t" x="389" y="803">blocked → a human</text><text class="hc-node-s" x="389" y="821">!!! in the feed</text></g>
</svg>
<figcaption>The three repairs run at once; whichever passes the attempt first wins. Red: model work.</figcaption>
