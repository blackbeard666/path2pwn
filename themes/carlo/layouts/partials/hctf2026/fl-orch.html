<figure class="hc-fig" id="fig-fl-orch">
<p class="hc-fig-title">The whole orchestration, one day</p>
<svg class="hc-svg" viewBox="0 0 960 1206" role="img" aria-labelledby="fl-orch-t fl-orch-d" preserveAspectRatio="xMidYMid meet">
<title id="fl-orch-t">The whole orchestration, one day</title><desc id="fl-orch-d">Warm-up and preflight, arming the launch, polling for the release, one chain per challenge, the operator&#x27;s monitoring loop, the GM-solved gate, then the post-run, post-mortem, fixes and rehearsal.</desc>

er-end="url(#ar-fl-orch)"/><g class="hc-node hc-node-ours"><title>warm-up: the operator session (Claude Code) starts the day</title><rect x="86" y="12" width="233" height="62" rx="31"/><text class="hc-node-t" x="112" y="35">warm-up</text><text class="hc-node-s" x="112" y="53">the operator session</text><text class="hc-node-s" x="112" y="67">(Claude Code) starts the day</text></g><g class="hc-node"><title>preflight green?: ~78 checks in 11 sections, incl. the fault-replay suite</title><polygon points="100,108 305,108 319,139 305,170 100,170 86,139"/><text class="hc-node-t" x="110" y="131">preflight green?</text><text class="hc-node-s" x="110" y="149">~78 checks in 11 sections, incl.</text><text class="hc-node-s" x="110" y="163">the fault-replay suite</text></g><g class="hc-node"><title>fix the cause: e.g. --fix kills a duplicate VPN client; then preflight again</title><rect x="363" y="108" width="233" height="62"/><text class="hc-node-t" x="377" y="131">fix the cause</text><text class="hc-node-s" x="377" y="149">e.g. --fix kills a duplicate VPN</text><text class="hc-node-s" x="377" y="163">client; then preflight again</text></g><g class="hc-node"><title>arm the launch: bin/day.sh N --wait: hctf run as a systemd unit with a memory cap</title><rect x="86" y="204" width="233" height="62"/><text class="hc-node-t" x="100" y="227">arm the launch</text><text class="hc-node-s" x="100" y="245">bin/day.sh N --wait: hctf run as a</text><text class="hc-node-s" x="100" y="259">systemd unit with a memory cap</text></g><g class="hc-node hc-node-plat"><title>is today listed?: ask the GM every 0.3 s; no → ask again</title><polygon points="100,300 305,300 319,331 305,362 100,362 86,331"/><text class="hc-node-t" x="110" y="323">is today listed?</text><text class="hc-node-s" x="110" y="341">ask the GM every 0.3 s;</text><text class="hc-node-s" x="110" y="355">no → ask again</text></g><g class="hc-node"><title>one chain per challenge: threads; LLM workers share five slots (--local 5)</title><rect x="86" y="396" width="233" height="62"/><text class="hc-node-t" x="100" y="419">one chain per challenge</text><text class="hc-node-s" x="100" y="437">threads; LLM workers share five</text><text class="hc-node-s" x="100" y="451">slots (--local 5)</text></g><g class="hc-node hc-node-ours"><title>chains run in parallel: single → Time Trial → Mastery, each as soon as it can</title><rect x="86" y="492" width="233" height="62"/><text class="hc-node-t" x="100" y="515">chains run in parallel</text><text class="hc-node-s" x="100" y="533">single → Time Trial → Mastery,</text><text class="hc-node-s" x="100" y="547">each as soon as it can</text></g><g class="hc-node"><title>operator reads the feed: one line per milestone + a heartbeat (hctf feed)</title><rect x="86" y="588" width="233" height="62"/><text class="hc-node-t" x="100" y="611">operator reads the feed</text><text class="hc-node-s" x="100" y="629">one line per milestone + a</text><text class="hc-node-s" x="100" y="643">heartbeat (hctf feed)</text></g><g class="hc-node hc-node-plat"><title>every mode GM-CORRECT?: checked against the GM, not local state (reconcile)</title><polygon points="100,684 305,684 319,715 305,746 100,746 86,715"/><text class="hc-node-t" x="110" y="707">every mode GM-CORRECT?</text><text class="hc-node-s" x="110" y="725">checked against the GM, not</text><text class="hc-node-s" x="110" y="739">local state (reconcile)</text></g><g class="hc-node"><title>a chain in trouble?: blocked, HELP.md, !!! alert, no progress</title><polygon points="377,684 583,684 597,715 583,746 377,746 363,715"/><text class="hc-node-t" x="387" y="707">a chain in trouble?</text><text class="hc-node-s" x="387" y="725">blocked, HELP.md, !!! alert,</text><text class="hc-node-s" x="387" y="739">no progress</text></g><g class="hc-node hc-node-ours"><title>operator steps in: arena reset, relaunch, a fix, or answer a HELP</title><rect x="363" y="780" width="233" height="62"/><text class="hc-node-t" x="377" y="803">operator steps in</text><text class="hc-node-s" x="377" y="821">arena reset, relaunch, a fix,</text><text class="hc-node-s" x="377" y="835">or answer a HELP</text></g><g class="hc-node"><title>post-run: ratchet, speed-harden, train, prebuild, coverage</title><rect x="86" y="780" width="233" height="62"/><text class="hc-node-t" x="100" y="803">post-run</text><text class="hc-node-s" x="100" y="821">ratchet, speed-harden, train,</text><text class="hc-node-s" x="100" y="835">prebuild, coverage</text></g><g class="hc-node hc-node-ours"><title>post-mortem: hctf timeline + KPI row + the slowest chains&#x27; logs</title><rect x="86" y="876" width="233" height="62"/><text class="hc-node-t" x="100" y="899">post-mortem</text><text class="hc-node-s" x="100" y="917">hctf timeline + KPI row +</text><text class="hc-node-s" x="100" y="931">the slowest chains&#x27; logs</text></g><g class="hc-node hc-node-ours"><title>fixes, each with a test: parallel agents on disjoint files; new fault scenarios</title><rect x="86" y="972" width="233" height="62"/><text class="hc-node-t" x="100" y="995">fixes, each with a test</text><text class="hc-node-s" x="100" y="1013">parallel agents on disjoint</text><text class="hc-node-s" x="100" y="1027">files; new fault scenarios</text></g><g class="hc-node"><title>rehearsal → next warm-up: replay a solved day on the fake GM, compare per mode</title><rect x="86" y="1068" width="233" height="62" rx="31"/><text class="hc-node-t" x="112" y="1091">rehearsal → next warm-up</text><text class="hc-node-s" x="112" y="1109">replay a solved day on the</text><text class="hc-node-s" x="112" y="1123">fake GM, compare per mode</text></g>
</svg>
<figcaption>One loop per day. Red: where reasoning happens (the operator session, its agents, the workers). Green: the platform.</figcaption>
<details class="hc-tv"><summary>steps and code</summary><div class="hc-tablewrap"><table class="hc-table "><thead><tr><th>step</th><th>what happens</th><th>code</th></tr></thead><tbody><tr><td>warm-up</td><td>A long-running Claude Code session that I talk to; it never solves a challenge.</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/bin/preflight.sh"><code>bin/preflight.sh</code></a></td></tr><tr><td>preflight green?</td><td>A red check or a red fault suite is a FAIL.</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/bin/preflight.sh"><code>bin/preflight.sh</code></a>, <a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/tests/test_fault_replay.py"><code>tests/test_fault_replay.py</code></a></td></tr><tr><td>fix the cause</td><td>The operator fixes what failed and re-runs the checks.</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/bin/preflight.sh"><code>bin/preflight.sh</code></a></td></tr><tr><td>arm the launch</td><td>Armed before the drop; after this nothing is re-checked.</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/bin/day.sh"><code>bin/day.sh</code></a></td></tr><tr><td>is today listed?</td><td>wait_for_release; release lag ended up 1-3 s.</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/orchestrate.py"><code>hctf/orchestrate.py</code></a></td></tr><tr><td>one chain per challenge</td><td>A process governor caps background solvers so a fan-out can&#x27;t starve the machine.</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/orchestrate.py"><code>hctf/orchestrate.py</code></a></td></tr><tr><td>chains run in parallel</td><td>Each chain is the single-solve, timed and failure flowcharts below.</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/orchestrate.py"><code>hctf/orchestrate.py</code></a></td></tr><tr><td>operator reads the feed</td><td>Solved k/N, blocked, generalize, duel, hint, !!! alerts.</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/feed.py"><code>hctf/feed.py</code></a></td></tr><tr><td>every mode GM-CORRECT?</td><td>The post-run is held until the GM confirms the whole board.</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/driftwatch.py"><code>hctf/driftwatch.py</code></a></td></tr><tr><td>a chain in trouble?</td><td>hctf why says WORKING, BLOCKED or DONE for each chain.</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/cli.py"><code>hctf/cli.py</code></a></td></tr><tr><td>post-run</td><td>Resumable phases, each behind a test gate (post-run flowchart below).</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/postrun.py"><code>hctf/postrun.py</code></a></td></tr><tr><td>operator steps in</td><td>Only on a hard stop.</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/cli.py"><code>hctf/cli.py</code></a></td></tr><tr><td>post-mortem</td><td>The operator writes a numbered fix plan; I approve, reject or reorder.</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/timeline.py"><code>hctf/timeline.py</code></a>, <a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/kpi.py"><code>hctf/kpi.py</code></a></td></tr><tr><td>fixes, each with a test</td><td>Every new failure mode becomes a scenario the next preflight runs.</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/tests/test_fault_replay.py"><code>tests/test_fault_replay.py</code></a></td></tr><tr><td>rehearsal → next warm-up</td><td>Critical-path changes are replayed before the next drop.</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/replay_gm.py"><code>hctf/replay_gm.py</code></a></td></tr></tbody></table></div></details>
</figure>
