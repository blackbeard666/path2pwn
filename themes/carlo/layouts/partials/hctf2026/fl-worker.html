ght="62"/><text class="hc-node-t" x="100" y="323">message 1 → READY → GO</text><text class="hc-node-s" x="100" y="341">static prompt first; GO with</text><text class="hc-node-s" x="100" y="355">triage at the download mark</text></g><g class="hc-node"><title>blocking command?: PreToolUse hook: pager, REPL, tail -f, listener</title><polygon points="100,396 305,396 319,427 305,458 100,458 86,427"/><text class="hc-node-t" x="110" y="419">blocking command?</text><text class="hc-node-s" x="110" y="437">PreToolUse hook: pager, REPL,</text><text class="hc-node-s" x="110" y="451">tail -f, listener</text></g><g class="hc-node"><title>refused with a reason: the model rewrites it with a timeout</title><rect x="363" y="396" width="233" height="62"/><text class="hc-node-t" x="377" y="419">refused with a reason</text><text class="hc-node-s" x="377" y="437">the model rewrites it with</text><text class="hc-node-s" x="377" y="451">a timeout</text></g><g class="hc-node hc-node-ours"><title>run the tool call: Bash (25 s default timeout), Read, Write, Edit, Skill, Task</title><rect x="86" y="492" width="233" height="62"/><text class="hc-node-t" x="100" y="515">run the tool call</text><text class="hc-node-s" x="100" y="533">Bash (25 s default timeout),</text><text class="hc-node-s" x="100" y="547">Read, Write, Edit, Skill, Task</text></g><g class="hc-node"><title>inbox → HARNESS UPDATE: PostToolUse hook; nudges at 10 and 30 minutes</title><rect x="86" y="588" width="233" height="62"/><text class="hc-node-t" x="100" y="611">inbox → HARNESS UPDATE</text><text class="hc-node-s" x="100" y="629">PostToolUse hook; nudges at</text><text class="hc-node-s" x="100" y="643">10 and 30 minutes</text></g><g class="hc-node hc-node-plat"><title>stopped at CORRECT: the watcher kills the worker (the usual ending)</title><rect x="363" y="588" width="233" height="62" rx="31"/><text class="hc-node-t" x="389" y="611">stopped at CORRECT</text><text class="hc-node-s" x="389" y="629">the watcher kills the worker</text><text class="hc-node-s" x="389" y="643">(the usual ending)</text></g><g class="hc-node"><title>may it stop?: Stop hook: CORRECT + cases pass, or HELP.md written</title><polygon points="100,684 305,684 319,715 305,746 100,746 86,715"/><text class="hc-node-t" x="110" y="707">may it stop?</text><text class="hc-node-s" x="110" y="725">Stop hook: CORRECT + cases</text><text class="hc-node-s" x="110" y="739">pass, or HELP.md written</text></g><g class="hc-node"><title>blocked (≤10 times): told what is missing; keeps working</title><rect x="363" y="684" width="233" height="62"/><text class="hc-node-t" x="377" y="707">blocked (≤10 times)</text><text class="hc-node-s" x="377" y="725">told what is missing;</text><text class="hc-node-s" x="377" y="739">keeps working</text></g><g class="hc-node"><title>how did it exit?: ok · max_turns · auth · limit · transient · error</title><polygon points="100,780 305,780 319,811 305,842 100,842 86,811"/><text class="hc-node-t" x="110" y="803">how did it exit?</text><text class="hc-node-s" x="110" y="821">ok · max_turns · auth · limit ·</text><text class="hc-node-s" x="110" y="835">transient · error</text></g><g class="hc-node"><title>auth → !!! alert: chain help: claude auth login</title><rect x="363" y="780" width="233" height="62"/><text class="hc-node-t" x="377" y="803">auth → !!! alert</text><text class="hc-node-s" x="377" y="821">chain help: claude auth login</text></g><g class="hc-node"><title>transient → relaunch: ≤3×: 20 / 60 / 180 s, fresh session, back to the gate</title><rect x="86" y="876" width="233" height="62" rx="31"/><text class="hc-node-t" x="112" y="899">transient → relaunch</text><text class="hc-node-s" x="112" y="917">≤3×: 20 / 60 / 180 s, fresh</text><text class="hc-node-s" x="112" y="931">session, back to the gate</text></g>
</svg>
