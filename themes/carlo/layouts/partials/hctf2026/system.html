<title id="system-t">How the whole system runs, day after day</title><desc id="system-d">Top row, during a drop: the operator session starts hctf run, which runs one chain per challenge, whose workers submit to the Game Master. Bottom row, overnight: the run&#x27;s record feeds the post-run, then a post-mortem and fixes, then the prebuild, then a rehearsal, which leads back to the next day&#x27;s warm-up.</desc>

lass="hc-node-s" x="532" y="73">claude -p in bwrap</text></g><g class="hc-node hc-node-plat"><rect x="690" y="30" width="156" height="58"/><text class="hc-node-t" x="702" y="54">Game Master</text><text class="hc-node-s" x="702" y="73">judges every answer</text></g><g class="hc-node "><rect x="690" y="168" width="156" height="58"/><text class="hc-node-t" x="702" y="192">the run&#x27;s record</text><text class="hc-node-s" x="702" y="211">logs, cases, cost</text></g><g class="hc-node "><rect x="520" y="168" width="156" height="58"/><text class="hc-node-t" x="532" y="192">post-run</text><text class="hc-node-s" x="532" y="211">library merge, tests</text></g><g class="hc-node hc-node-ours"><rect x="350" y="168" width="156" height="58"/><text class="hc-node-t" x="362" y="192">post-mortem + fixes</text><text class="hc-node-s" x="362" y="211">operator + agents</text></g><g class="hc-node "><rect x="180" y="168" width="156" height="58"/><text class="hc-node-t" x="192" y="192">prebuild</text><text class="hc-node-s" x="192" y="211">breadth, off-peak</text></g><g class="hc-node "><rect x="10" y="168" width="156" height="58"/><text class="hc-node-t" x="22" y="192">rehearsal</text><text class="hc-node-s" x="22" y="211">replay + fault suite</text></g>

<figcaption>One loop per day. Red: where the thinking happens (the operator session, its agents and the workers). Green: the platform.</figcaption>
<details class="hc-tv"><summary>stages and code</summary><div class="hc-tablewrap"><table class="hc-table "><thead><tr><th>stage</th><th>what it does</th><th>code</th></tr></thead><tbody><tr><td>operator session</td><td>a long-running Claude Code session I direct: arms the day, watches the feed, intervenes, writes post-mortems and code</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/bin/day.sh"><code>bin/day.sh</code></a>, <a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/feed.py"><code>hctf/feed.py</code></a></td></tr><tr><td>hctf run</td><td>detects the release, starts one chain per challenge, caps workers at five slots</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/orchestrate.py"><code>hctf/orchestrate.py</code></a></td></tr><tr><td>chains</td><td>one thread per challenge: single → Time Trial → Mastery, state in chain.json</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/orchestrate.py"><code>hctf/orchestrate.py</code></a></td></tr><tr><td>workers</td><td>headless Claude Code in a bubblewrap sandbox, steered by hooks</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/workers.py"><code>hctf/workers.py</code></a>, <a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/.claude/hooks/nudge.py"><code>.claude/hooks/nudge.py</code></a></td></tr><tr><td>Game Master</td><td>the organizers' API; the only judge of right and wrong</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/gm.py"><code>hctf/gm.py</code></a></td></tr><tr><td>the run's record</td><td>chain states, worker logs, regression cases, the cost ledger</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/solvers.py"><code>hctf/solvers.py</code></a></td></tr><tr><td>post-run</td><td>ratchet (library merge), speed-harden, train (replay every earlier day), behind tests</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/postrun.py"><code>hctf/postrun.py</code></a></td></tr><tr><td>post-mortem + fixes</td><td>the operator reads the timeline and costs, writes a plan; parallel agents implement it</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/reference/D28_POSTMORTEM.md"><code>reference/D28_POSTMORTEM.md</code></a></td></tr><tr><td>prebuild</td><td>off-peak workers build decoders for variants not seen yet, kept behind fixtures</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/prebuild.py"><code>hctf/prebuild.py</code></a></td></tr><tr><td>rehearsal</td><td>replay a solved day on the fake GM; the fault suite and preflight gate the next launch</td><td><a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/hctf/replay_gm.py"><code>hctf/replay_gm.py</code></a>, <a href="https://github.com/blackbeard666/huntress-ctf-2026-ai-harness/blob/HEAD/bin/preflight.sh"><code>bin/preflight.sh</code></a></td></tr></tbody></table></div></details>
